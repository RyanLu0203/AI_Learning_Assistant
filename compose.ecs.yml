# Standalone deployment file: pulls the image built locally and pushed to ACR.
# Task 2: set AILA_BIND_ADDRESS=0.0.0.0 and restrict the ECS security group
# to your own public IP. Task 3: restore 127.0.0.1 and close public port 14242.
services:
  backend:
    image: ${AILA_IMAGE:?Set AILA_IMAGE to your full ACR image reference}
    restart: unless-stopped
    init: true
    ports:
      - "${AILA_BIND_ADDRESS:-127.0.0.1}:${AILA_BACKEND_PORT:-14242}:14242"
    environment:
      APP_SQLITE_PATH: /app/data/app.sqlite
      WORKSPACE_ROOT: /app/workspace
      MODEL_PROVIDER: openai_compatible
      MODEL_BASE_URL: ${MODEL_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      MODEL_NAME: ${MODEL_NAME:-qwen3.6-flash}
      MODEL_SECRET_FILE: /app/data/model-secrets.env
      MODEL_KEY_ENCRYPTION_FILE: /app/data/model-key-encryption.key
      MODEL_CONTEXT_WINDOW: ${MODEL_CONTEXT_WINDOW:-1000000}
      MODEL_SUPPORTS_STREAMING: ${MODEL_SUPPORTS_STREAMING:-true}
    volumes:
      - ./data:/app/data
      - ./workspace:/app/workspace
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:14242/health', timeout=2).read()"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 10s
